<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saumya Kumar Das | Junior Programmer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome for GitHub & LinkedIn logos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #0a1f44;
      --secondary: #1e90ff;
      --light: #f5f7fa;
      --dark: #222;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 40px 20px;
      text-align: center;
      position: relative;
    }

    /* Profile image (top-left) */
    .profile-pic {
      position: absolute;
      top: 10px;
      left: 190px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }

    header h1 {
      font-size: 2.5rem;
    }

    header p {
      margin-top: 10px;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    nav {
      background: #fff;
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
    }

    section {
      padding: 50px 20px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      color: var(--primary);
      margin-bottom: 20px;
      border-left: 5px solid var(--secondary);
      padding-left: 10px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    ul {
      padding-left: 20px;
    }

    .skills span {
      display: inline-block;
      background: var(--secondary);
      color: white;
      padding: 8px 12px;
      margin: 6px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .contact p {
      margin: 8px 0;
    }

    .social-icons a {
      margin-right: 15px;
      font-size: 22px;
      color: var(--primary);
      text-decoration: none;
    }

    .social-icons a:hover {
      color: var(--secondary);
    }

    footer {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: 0.8s ease;
    }

    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ✅ ONLY FIX — MOBILE */
    @media (max-width: 600px) {
      .profile-pic {
        width: 70px;
        height: 70px;
        top: 15px;
        left: 15px;
      }

      header h1 {
        font-size: 2rem;
        margin-top: 90px; /* prevents overlap */
      }
    }
  </style>
</head>

<body>

<header>
  <img src="Saumya.jpg" alt="Saumya Kumar Das" class="profile-pic">
  <h1>Saumya Kumar Das</h1>
  <p>Junior Programmer | Flutter Developer | Java Developer</p>
</header>

<nav>
  <a href="#about">About</a>
  <a href="#skills">Skills</a>
  <a href="#experience">Experience</a>
  <a href="#projects">Projects</a>
  <a href="#education">Education</a>
  <a href="#contact">Contact</a>
</nav>

<!-- rest of your content unchanged -->

</body>
</html>
